<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>南+ 扫描结果</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --ink-3: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --border: rgba(11, 11, 11, 0.10);
    --cat-1: #2a78d6;
    --cat-2: #eb6834;
    --cat-3: #1baf7a;
    --good: #0ca30c;
    --warn: #d98a00;
    --serious: #ec835a;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb;
    --ink: #0b0b0b; --ink-2: #52514e; --ink-3: #898781;
    --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11, 11, 11, 0.10);
    --cat-1: #2a78d6; --cat-2: #eb6834; --cat-3: #1baf7a;
    --good: #0ca30c; --warn: #d98a00; --serious: #ec835a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19;
      --ink: #ffffff; --ink-2: #c3c2b7; --ink-3: #898781;
      --grid: #2c2c2a; --axis: #383835; --border: rgba(255, 255, 255, 0.10);
      --cat-1: #3987e5; --cat-2: #d95926; --cat-3: #199e70;
      --good: #0ca30c; --warn: #c98500; --serious: #ec835a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19;
    --ink: #ffffff; --ink-2: #c3c2b7; --ink-3: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255, 255, 255, 0.10);
    --cat-1: #3987e5; --cat-2: #d95926; --cat-3: #199e70;
    --good: #0ca30c; --warn: #c98500; --serious: #ec835a;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--ink);
    font-size: 14px;
    line-height: 1.5;
  }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 32px 20px 64px; }

  header.top {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 16px; flex-wrap: wrap; margin-bottom: 28px;
  }
  header.top h1 { font-size: 20px; margin: 0 0 4px; font-weight: 650; }
  header.top .meta { color: var(--ink-2); font-size: 13px; }
  header.top .meta .file { font-variant-numeric: tabular-nums; }
  .actions { display: flex; gap: 8px; }
  button {
    font: inherit; color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--axis);
    border-radius: 8px; padding: 6px 12px; cursor: pointer;
  }
  button:hover { border-color: var(--ink-3); }

  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 32px; }
  .kpi {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px; padding: 14px 16px;
  }
  .kpi .label { color: var(--ink-2); font-size: 13px; display: flex; align-items: center; gap: 6px; }
  .kpi .dot { width: 8px; height: 8px; border-radius: 2px; flex: none; }
  .kpi .value { font-size: 26px; font-weight: 650; margin-top: 4px; }

  section.table-section { margin-bottom: 32px; }
  section.table-section > h2 {
    font-size: 16px; font-weight: 650; margin: 0 0 10px;
    display: flex; align-items: center; gap: 8px;
  }
  section.table-section > h2 .dot { width: 10px; height: 10px; border-radius: 3px; }
  section.table-section > h2 .count {
    color: var(--ink-3); font-weight: 500; font-size: 13px;
    font-variant-numeric: tabular-nums;
  }
  .table-scroll { overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
  table { width: 100%; border-collapse: collapse; min-width: 560px; }
  thead th {
    text-align: left; font-weight: 550; color: var(--ink-2); font-size: 12px;
    padding: 10px 14px; border-bottom: 1px solid var(--axis);
    white-space: nowrap; background: var(--surface);
  }
  tbody td { padding: 9px 14px; border-bottom: 1px solid var(--grid); vertical-align: top; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: rgba(0, 0, 0, 0.03); }
  :root[data-theme="dark"] tbody tr:hover td, :root:not([data-theme="light"]) tbody tr:hover td { background: rgba(255,255,255,0.05); }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .title { max-width: 380px; }
  .title a { color: var(--ink); text-decoration: none; }
  .title a:hover { text-decoration: underline; }
  .tid { color: var(--ink-3); font-variant-numeric: tabular-nums; font-size: 13px; white-space: nowrap; }
  .status { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .status .sdot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .st-good .sdot { background: var(--good); }
  .st-warn .sdot { background: var(--warn); }
  .st-serious .sdot { background: var(--serious); }
  .st-none .sdot { background: var(--ink-3); }
  .chip {
    display: inline-block; font-size: 12px; color: var(--ink-2);
    background: var(--page); border: 1px solid var(--grid);
    border-radius: 999px; padding: 1px 9px; margin: 1px 4px 1px 0;
    white-space: nowrap; max-width: 240px; overflow: hidden;
    text-overflow: ellipsis; vertical-align: middle;
  }
  .chip a { color: inherit; text-decoration: none; }
  .chip a:hover { text-decoration: underline; }
  .empty { color: var(--ink-3); padding: 16px 14px; }

  .drop-zone {
    position: fixed; inset: 0; background: var(--page);
    display: none; align-items: center; justify-content: center; padding: 20px;
    z-index: 10;
  }
  .drop-zone.show { display: flex; }
  .drop-card {
    background: var(--surface); border: 1px dashed var(--axis);
    border-radius: 16px; padding: 40px; max-width: 460px; text-align: center;
  }
  .drop-card h2 { margin: 0 0 10px; font-size: 17px; }
  .drop-card p { color: var(--ink-2); margin: 0 0 18px; font-size: 13px; }
  .drop-card input[type="file"] { display: none; }
  .drop-card .btn {
    display: inline-block; background: var(--cat-1); color: #fff;
    border-radius: 8px; padding: 8px 16px; cursor: pointer; font-weight: 550;
  }
  .drop-card .hint { color: var(--ink-3); font-size: 12px; margin-top: 14px; }
  .error { color: #d03b3b; margin: 12px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>南+ 扫描结果</h1>
      <div class="meta">
        <span id="scanTime">—</span>
        &nbsp;·&nbsp; <span class="file" id="fileMeta">threads_analysis.json</span>
      </div>
    </div>
    <div class="actions">
      <button id="themeBtn" type="button" title="切换主题">主题：自动</button>
      <button id="reloadBtn" type="button">重新加载</button>
    </div>
  </header>

  <div class="kpi-row" id="kpiRow"></div>

  <section class="table-section">
    <h2><span class="dot" style="background: var(--cat-1)"></span>长文帖 <span class="count" id="cnt-long"></span></h2>
    <div class="table-scroll">
      <table>
        <thead><tr><th>标题</th><th class="num">TID</th><th class="num">页</th><th class="num">字数</th><th>付费状态</th></tr></thead>
        <tbody id="rows-long"></tbody>
      </table>
    </div>
  </section>

  <section class="table-section">
    <h2><span class="dot" style="background: var(--cat-2)"></span>付费帖 <span class="count" id="cnt-paywall"></span></h2>
    <div class="table-scroll">
      <table>
        <thead><tr><th>标题</th><th class="num">TID</th><th class="num">页</th><th class="num">售价</th><th>付费状态</th><th class="num">字数</th></tr></thead>
        <tbody id="rows-paywall"></tbody>
      </table>
    </div>
  </section>

  <section class="table-section">
    <h2><span class="dot" style="background: var(--cat-3)"></span>含 gofile 链接帖 <span class="count" id="cnt-gofile"></span></h2>
    <div class="table-scroll">
      <table>
        <thead><tr><th>标题</th><th class="num">TID</th><th class="num">页</th><th>gofile 链接</th><th>付费状态</th></tr></thead>
        <tbody id="rows-gofile"></tbody>
      </table>
    </div>
  </section>
</div>

<div class="drop-zone" id="dropZone">
  <div class="drop-card">
    <h2>选择扫描结果文件</h2>
    <p>直接双击打开网页时，浏览器禁止网页读取本地文件。请选择或拖拽 <strong>threads_analysis.json</strong>。</p>
    <label class="btn" for="fileInput">选择文件…</label>
    <input type="file" id="fileInput" accept=".json,application/json">
    <div class="hint">也可以把 .json 文件直接拖拽到本窗口内</div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ---------- 主题 ----------
  const THEMES = ['system', 'light', 'dark'];
  const THEME_LABEL = { system: '自动', light: '浅色', dark: '深色' };
  let themeIdx = THEMES.indexOf(localStorage.getItem('sp-theme') || 'system');
  if (themeIdx < 0) themeIdx = 0;
  applyTheme();
  document.getElementById('themeBtn').addEventListener('click', function () {
    themeIdx = (themeIdx + 1) % THEMES.length;
    localStorage.setItem('sp-theme', THEMES[themeIdx]);
    applyTheme();
  });
  function applyTheme() {
    const t = THEMES[themeIdx];
    const root = document.documentElement;
    if (t === 'system') root.removeAttribute('data-theme');
    else root.setAttribute('data-theme', t);
    document.getElementById('themeBtn').textContent = '主题：' + THEME_LABEL[t];
  }

  // ---------- 工具 ----------
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function paywall(status) {
    const map = {
      free_purchased: ['已免费领取', 'st-good'],
      paid_only:      ['仅付费',     'st-warn'],
      paid:           ['付费未购',   'st-serious'],
      none:           ['无',         'st-none']
    };
    const m = map[status] || ['—', 'st-none'];
    return '<span class="status ' + m[1] + '"><span class="sdot"></span>' + esc(m[0]) + '</span>';
  }
  function priceCell(price) {
    if (price == null || price === -1) return '<span class="tid">未知</span>';
    const txt = price === 0 ? '0 SP（免费）' : price + ' SP';
    return '<span class="num">' + esc(txt) + '</span>';
  }
  function gofileCell(links) {
    if (!links || links.length === 0) return '<span class="tid">—</span>';
    const shown = links.slice(0, 3).map(function (u) {
      return '<span class="chip"><a href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(u.replace(/^https?:\/\//, '')) + '</a></span>';
    }).join('');
    const more = links.length > 3 ? '<span class="chip">+' + (links.length - 3) + '</span>' : '';
    return shown + more;
  }

  // ---------- 渲染 ----------
  function render(data) {
    const s = data.summary || {};
    const time = data.scannedAt ? new Date(data.scannedAt) : null;
    document.getElementById('scanTime').textContent =
      time ? '扫描时间：' + time.toLocaleString('zh-CN', { hour12: false }) : '扫描时间：未知';

    // KPI
    const tiles = [
      { label: '长文帖', value: s.longTextCount || 0, color: 'var(--cat-1)' },
      { label: '付费帖', value: s.paywallCount || 0, color: 'var(--cat-2)' },
      { label: '含 gofile 链接帖', value: s.gofileCount || 0, color: 'var(--cat-3)' },
      { label: '本次新增缓存', value: s.newlyScanned || 0, color: 'var(--ink-3)' }
    ];
    document.getElementById('kpiRow').innerHTML = tiles.map(function (t) {
      return '<div class="kpi"><div class="label"><span class="dot" style="background:' + t.color + '"></span>' + esc(t.label) + '</div><div class="value">' + t.value + '</div></div>';
    }).join('');

    // 长文帖
    const long = data.longTextPosts || [];
    document.getElementById('cnt-long').textContent = '(' + long.length + ')';
    document.getElementById('rows-long').innerHTML = long.length
      ? long.map(function (p) {
          return '<tr><td class="title"><a href="' + esc(p.url) + '" target="_blank" rel="noopener">' + esc(p.title) + '</a></td>' +
            '<td class="num"><span class="tid">' + esc(p.tid) + '</span></td>' +
            '<td class="num">' + esc(p.page) + '</td>' +
            '<td class="num">' + esc(p.charCount) + '</td>' +
            '<td>' + paywall(p.paywallStatus) + '</td></tr>';
        }).join('')
      : '<tr><td colspan="5" class="empty">本次没有发现长文帖</td></tr>';

    // 付费帖
    const paywall = data.paywallPosts || [];
    document.getElementById('cnt-paywall').textContent = '(' + paywall.length + ')';
    document.getElementById('rows-paywall').innerHTML = paywall.length
      ? paywall.map(function (p) {
          return '<tr><td class="title"><a href="' + esc(p.url) + '" target="_blank" rel="noopener">' + esc(p.title) + '</a></td>' +
            '<td class="num"><span class="tid">' + esc(p.tid) + '</span></td>' +
            '<td class="num">' + esc(p.page) + '</td>' +
            '<td class="num">' + priceCell(p.price) + '</td>' +
            '<td>' + paywall(p.paywallStatus) + '</td>' +
            '<td class="num">' + esc(p.charCount) + '</td></tr>';
        }).join('')
      : '<tr><td colspan="6" class="empty">本次没有发现付费帖</td></tr>';

    // gofile
    const gofile = data.gofilePosts || [];
    document.getElementById('cnt-gofile').textContent = '(' + gofile.length + ')';
    document.getElementById('rows-gofile').innerHTML = gofile.length
      ? gofile.map(function (p) {
          return '<tr><td class="title"><a href="' + esc(p.url) + '" target="_blank" rel="noopener">' + esc(p.title) + '</a></td>' +
            '<td class="num"><span class="tid">' + esc(p.tid) + '</span></td>' +
            '<td class="num">' + esc(p.page) + '</td>' +
            '<td>' + gofileCell(p.gofileLinks) + '</td>' +
            '<td>' + paywall(p.paywallStatus) + '</td></tr>';
        }).join('')
      : '<tr><td colspan="5" class="empty">本次没有发现含 gofile 链接的帖子</td></tr>';
  }

  function renderError(msg) {
    document.getElementById('kpiRow').innerHTML = '<div class="error">' + esc(msg) + '</div>';
    document.getElementById('rows-long').innerHTML = '';
    document.getElementById('rows-paywall').innerHTML = '';
    document.getElementById('rows-gofile').innerHTML = '';
  }

  // ---------- 数据加载 ----------
  let currentFile = null;

  function loadFromJson(text, fileMeta) {
    try {
      const data = JSON.parse(text);
      if (!data || !data.summary) throw new Error('不是有效的扫描结果文件（缺少 summary）');
      document.getElementById('fileMeta').textContent = fileMeta || 'threads_analysis.json';
      render(data);
    } catch (e) {
      renderError('解析失败：' + e.message);
    }
  }

  function loadFromFile(file) {
    currentFile = file;
    const reader = new FileReader();
    reader.onload = function () { loadFromJson(String(reader.result), file.name); };
    reader.onerror = function () { renderError('读取文件失败'); };
    reader.readAsText(file);
  }

  function hideDrop() { document.getElementById('dropZone').classList.remove('show'); }

  async function loadFromUrl() {
    try {
      const res = await fetch('./threads_analysis.json');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      loadFromJson(text, 'threads_analysis.json');
      return true;
    } catch (e) {
      return false;
    }
  }

  async function init() {
    const ok = await loadFromUrl();
    if (!ok) document.getElementById('dropZone').classList.add('show');
  }

  document.getElementById('reloadBtn').addEventListener('click', async function () {
    if (currentFile) { loadFromFile(currentFile); return; }
    const ok = await loadFromUrl();
    if (!ok) document.getElementById('dropZone').classList.add('show');
  });

  // 文件选择 / 拖拽
  document.getElementById('fileInput').addEventListener('change', function (e) {
    const f = e.target.files && e.target.files[0];
    if (f) { loadFromFile(f); hideDrop(); }
  });
  const dz = document.getElementById('dropZone');
  document.addEventListener('dragover', function (e) { e.preventDefault(); });
  document.addEventListener('drop', function (e) {
    e.preventDefault();
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) { loadFromFile(f); hideDrop(); }
  });

  init();
})();
</script>
</body>
</html>
