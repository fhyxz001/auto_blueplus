name: 构建离线 Docker 镜像

# 触发方式：推送/提交到 main 后自动构建；也可在 Actions 页面点「Run workflow」手动触发
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      image_tag:
        description: '镜像标签'
        required: false
        default: 'latest'

permissions:
  contents: read

jobs:
  build-offline-image:
    name: 构建并导出离线镜像
    runs-on: ubuntu-latest
    env:
      # 手动触发时用输入的标签，推送触发时默认 latest
      IMAGE_TAG: ${{ inputs.image_tag || 'latest' }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 校验 Playwright 版本与 Dockerfile 基础镜像一致
        run: |
          PW=$(node -p "require('./package.json').dependencies.playwright.replace('^','')")
          if grep -q "FROM mcr.microsoft.com/playwright:v${PW}" Dockerfile; then
            echo "OK: Dockerfile 基础镜像与 playwright ${PW} 一致"
          else
            echo "::warning::Dockerfile 基础镜像 tag 与 playwright ${PW} 不一致，请检查"
          fi

      - name: 构建镜像
        run: docker build -t southplus_auto:${{ env.IMAGE_TAG }} .

      - name: 导出为 gzip 压缩的 tar
        run: |
          mkdir -p out
          docker save southplus_auto:${{ env.IMAGE_TAG }} | gzip > out/southplus_auto-image.tar.gz
          du -sh out/southplus_auto-image.tar.gz

      - name: 按 900MB 分片（便于跨机器传输与上传）
        run: |
          cd out
          split -b 900M -d -a 2 southplus_auto-image.tar.gz southplus_auto-image.tar.gz.part-
          rm -f southplus_auto-image.tar.gz
          ls -lh

      - name: 生成离线加载说明
        run: |
          cat > out/LOAD.md <<'EOF'
          # 南+ 扫描控制台 - 离线镜像部署说明

          ## 1. 汇总分片
          把下载到的所有 `southplus_auto-image.tar.gz.part-*` 放到同一目录，执行：
            cat southplus_auto-image.tar.gz.part-* > southplus_auto-image.tar.gz

          ## 2. 导入镜像（docker load 支持 gzip）
            docker load -i southplus_auto-image.tar.gz

          ## 3. 准备数据目录（放入 auth.json）
            mkdir -p /opt/southplus/data
            cp auth.json /opt/southplus/data/

          ## 4. 启动容器
            docker run -d --name southplus_auto \
              --restart unless-stopped --init \
              -p 3456:3456 \
              -v /opt/southplus/data:/data \
              -e SP_DATA_DIR=/data \
              southplus_auto:${{ env.IMAGE_TAG }}

          ## 5. 访问控制台
            http://localhost:3456

          提示：若使用 docker-compose，删掉 docker-compose.yml 里的 `build:` 段、
          直接写 `image: southplus_auto:latest` 并保留 volumes 挂载即可。
          EOF

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: southplus_auto-offline-image
          path: out/
          if-no-files-found: error
          retention-days: 7
