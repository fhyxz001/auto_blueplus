name: 构建离线 Docker 镜像

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-offline-image:
    name: 构建并导出可直接导入的离线镜像
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 校验 Playwright 版本与 Dockerfile 基础镜像一致
        run: |
          PW=$(node -p "require('./package.json').dependencies.playwright.replace('^','')")
          if grep -q "FROM mcr.microsoft.com/playwright:v${PW}" Dockerfile; then
            echo "OK: Dockerfile 基础镜像与 playwright ${PW} 一致"
          else
            echo "::warning::Dockerfile 基础镜像 tag 与 playwright ${PW} 不一致，请检查"
          fi

      - name: 构建镜像（amd64）
        run: docker build -t southplus_auto:latest .

      - name: 导出为单个 tar（飞牛 NAS 可直接导入）
        run: |
          mkdir -p out
          docker save southplus_auto:latest -o out/southplus_auto.tar
          du -sh out/southplus_auto.tar

      - name: 检查体积（GitHub 单个 artifact 上限约 2GB）
        run: |
          s=$(stat -c%s out/southplus_auto.tar)
          echo "体积: out/southplus_auto.tar -> $(du -h out/southplus_auto.tar | cut -f1)"
          if [ "$s" -gt 1900000000 ]; then
            echo "::error::镜像超过 1.9GB，接近 GitHub 上传上限，需要精简镜像"
            exit 1
          fi

      - name: 生成部署说明
        run: |
          cat > out/部署说明.md <<'EOF'
          # 南+ 扫描控制台 — 飞牛 NAS 部署说明

          ## 1. 导入镜像（二选一）
          方式 A（图形界面）：飞牛 Docker → 镜像 → 导入镜像 → 上传 southplus_auto.tar
          方式 B（终端 / SSH）：
            docker load -i southplus_auto.tar

          导入后在镜像列表应能看到 southplus_auto:latest。

          ## 2. 准备数据目录
          创建目录（例如 /vol1/1000/docker/southplus/data），把 auth.json 放进去。

          ## 3. 用 Compose 启动（飞牛 Docker → 项目 → 新建项目）
          粘贴以下内容（把 volume 路径换成你的实际路径）：
          ```yaml
          services:
            southplus:
              image: southplus_auto:latest
              container_name: southplus_auto
              restart: unless-stopped
              init: true
              ports:
                - "3456:3456"
              volumes:
                - /vol1/1000/docker/southplus/data:/data
              environment:
                - SP_DATA_DIR=/data
                # 访问 blue-plus.net 需要代理时取消注释：
                # - SP_PROXY=http://<NAS网关IP>:7890
                # - SP_PROXY_BYPASS=localhost,127.0.0.1
              shm_size: 2gb
          ```

          ## 4. 访问控制台
          浏览器打开 http://<NAS的IP>:3456

          提示：控制面板没有登录鉴权，请勿把 3456 端口直接暴露到公网。
          EOF

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: southplus_auto-offline-image
          path: out/
          if-no-files-found: error
          retention-days: 7
